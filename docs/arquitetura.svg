<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="vazada" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="#ffffff"/>
  <text x="800" y="54" text-anchor="middle" font-size="34" font-weight="bold" fill="#111827">Livraria — Arquitetura Clean</text>

  <circle cx="520" cy="520" r="400" fill="#a8d8f8" stroke="#000" stroke-width="3"/>
  <circle cx="520" cy="520" r="300" fill="#a3f5b5" stroke="#000" stroke-width="3"/>
  <circle cx="520" cy="520" r="200" fill="#f9a3a3" stroke="#000" stroke-width="3"/>
  <circle cx="520" cy="520" r="105" fill="#fdf7b4" stroke="#000" stroke-width="3"/>

  <g text-anchor="middle" fill="#111827">
    <text x="520" y="168" font-size="23" font-weight="bold">Frameworks &amp; Drivers</text>
    <text x="520" y="196" font-size="18">ui/ (Flask, HTML) · livraria.txt</text>
    <text x="520" y="266" font-size="23" font-weight="bold">Interface Adapters</text>
    <text x="520" y="294" font-size="18">controllers/ · infrastructure/</text>
    <text x="520" y="368" font-size="23" font-weight="bold">Use Cases</text>
    <text x="520" y="396" font-size="18">use_cases/</text>
    <text x="520" y="512" font-size="23" font-weight="bold">Entities</text>
    <text x="520" y="540" font-size="18">entities/</text>
  </g>

  <!-- setas para dentro -->
  <line x1="150" y1="640" x2="215" y2="640" stroke="#000" stroke-width="3" marker-end="url(#seta)"/>
  <line x1="250" y1="640" x2="315" y2="640" stroke="#000" stroke-width="3" marker-end="url(#seta)"/>
  <line x1="350" y1="640" x2="420" y2="640" stroke="#000" stroke-width="3" marker-end="url(#seta)"/>
  <text x="520" y="880" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">dependências apontam para dentro →</text>

  <!-- legenda -->
  <g fill="#111827" font-size="19">
    <text x="990" y="150" font-size="24" font-weight="bold">Pasta → papel</text>
    <rect x="990" y="175" width="24" height="24" fill="#fdf7b4" stroke="#000"/>
    <text x="1026" y="194"><tspan font-weight="bold">entities/</tspan> — Livro, Reserva, Cupom... e regras</text>
    <rect x="990" y="215" width="24" height="24" fill="#f9a3a3" stroke="#000"/>
    <text x="1026" y="234"><tspan font-weight="bold">use_cases/</tspan> — reservar, comprar, avaliar...</text>
    <rect x="990" y="255" width="24" height="24" fill="#a3f5b5" stroke="#000"/>
    <text x="1026" y="274"><tspan font-weight="bold">controllers/</tspan> — fluxo das requisições</text>
    <rect x="990" y="295" width="24" height="24" fill="#a3f5b5" stroke="#000"/>
    <text x="1026" y="314"><tspan font-weight="bold">infrastructure/</tspan> — salva e lê o TXT</text>
    <rect x="990" y="335" width="24" height="24" fill="#a8d8f8" stroke="#000"/>
    <text x="1026" y="354"><tspan font-weight="bold">ui/</tspan> — rotas Flask e páginas HTML</text>
  </g>

  <!-- DIP -->
  <text x="990" y="440" font-size="24" font-weight="bold" fill="#111827">DIP (inversão de dependência)</text>
  <rect x="1000" y="465" width="500" height="90" rx="6" fill="#f9a3a3" stroke="#000" stroke-width="2"/>
  <text x="1250" y="500" text-anchor="middle" font-size="16" fill="#111827">«interface»  use_cases/repositorio.py</text>
  <text x="1250" y="530" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">RepositorioLivraria</text>
  <rect x="1000" y="650" width="500" height="80" rx="6" fill="#a3f5b5" stroke="#000" stroke-width="2"/>
  <text x="1250" y="682" text-anchor="middle" font-size="16" fill="#111827">infrastructure/repositorio_txt.py</text>
  <text x="1250" y="712" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">RepositorioTxt</text>
  <line x1="1250" y1="648" x2="1250" y2="559" stroke="#000" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#vazada)"/>
  <text x="1265" y="610" font-size="16" fill="#111827">implementa</text>
  <g stroke="#000" stroke-width="2" fill="#a8d8f8">
    <path d="M1180,790 L1320,790 L1340,810 L1340,880 L1180,880 Z"/>
  </g>
  <text x="1260" y="842" text-anchor="middle" font-size="18" fill="#111827">livraria.txt</text>
  <line x1="1250" y1="732" x2="1250" y2="786" stroke="#000" stroke-width="2" marker-end="url(#seta)"/>
  <text x="1000" y="610" font-size="15" fill="#374151" text-anchor="start">casos de uso só</text>
  <text x="1000" y="630" font-size="15" fill="#374151" text-anchor="start">conhecem a interface</text>
</svg>
